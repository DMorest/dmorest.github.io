# ==============================================
# Hexo Theme Phigros — 主题配置
# 复制本文件到站点根目录为 _config.phigros.yml 后修改
# ==============================================

# 导航菜单
menu:
  首页: /
  归档: /archives
  标签: /tags
  关于: /about
  分类: /categories/

# 判定线动效
judgeline:
  enable: true
  color: "#38bdf8"
  speed: 4

# 首页文章卡片
index:
  excerpt_length: 140
  show_meta: true

# 文章页
post:
  show_reading_progress: true
  show_prev_next: true

# 页脚
footer:
  since: 2024
  author: ""
  powered_by: true

# 字体：Saira 负责拉丁字母/UI；中文优先使用 Source Han Sans SC（思源黑体）
fonts:
  enable: true

# PhigrOS / D.O.M.E 视觉系统
phigros:
  system_name: "PhigrOS"
  dome_label: "D.O.M.E"
  accent: "#39b9e8"

# 背景系统
background:
  image: "/images/bg.jpg"
  blur: "5px"
  brightness: "0.12"
  grid: true
  grid_color: "57, 185, 232"

# ==============================================================
# Saturn Virtual OS / FILE_CONTENT
#
# Category ID（内部名）统一使用英文，例如：log / tutorial / creative。
# 页面显示名称写在 name 中；title 用于 Folder 标题。
# 文章 Front Matter 推荐：
#
# categories:
#   - log
#
# 也兼容旧文章直接写“日志 / 教程 / 创作”，主题会自动映射到对应 ID。
# ==============================================================
saturn:
  analysis_default: 100
  supervisor_default: "D.O.M.E"
  category_default: "main"

  # 分类配置：键名是内部 Category ID，name 是对外显示名称。
  categories:
    log:
      name: "日志"
      title: "日志"
      subtitle: "最直接的记录。"
      cover: "/images/home/log.jpg"
      completion: 100

    tutorial:
      name: "教程"
      title: "教程"
      subtitle: "哈默尔恩的回响。"
      cover: "/images/home/tutorial.jpg"
      completion: 100

    creative:
      name: "创作"
      title: "创作"
      subtitle: "你听见天使之乐了吗？"
      cover: "/images/home/creation.jpg"
      completion: 100

  # 不作为公开 Category 显示，仅用于没有分类时的默认 Folder 数据。
  folder_defaults:
    main:
      name: "MAIN"
      title: "MAIN"
      subtitle: "MAIN_STORY"
      cover: ""
      completion: 100

  # /categories/ 中没有自定义图片时使用的默认封面。
  category_fallback_cover: "/images/category-default.jpg"

# 首页启动界面 / 内容配置
home:
  timeline_count: 6
  features:
    - category: "log"
      title: "日志"
      subtitle: "最直接的记录。"
      image: "/images/home/log.jpg"
    - category: "tutorial"
      title: "教程"
      subtitle: "哈默尔恩的回响。"
      image: "/images/home/tutorial.jpg"
    - category: "creative"
      title: "创作"
      subtitle: "你听见天使之乐了吗？"
      image: "/images/home/creation.jpg"
  misc:
    contact: "dmorest@foxmail.com"
    contact_url: "mailto:dmorest@foxmail.com"
    social:
      bilibili: "https://space.bilibili.com/442631701"
      github: "https://github.com/DMorest"
      x: "https://x.com/dmorest0609"
      email: "mailto:dmorest@foxmail.com"
    copyright_title: "PHATASiA LOTUS LAND"
    friends: []

# Moe Counter 总访问量：全站每次页面访问均计数，仅在 About 与首页最后一屏显示。
visitor_counter:
  enable: true
  id: "dmorest.github.io"
  theme: "random"

# Waline 评论系统
comments:
  enable: true
  waline:
    serverURL: "https://phatasia-dm.vercel.app"
    lang: "zh-CN"
    dark: true
    path: ""

# 浏览器语言自动切换：zh-CN / ja / en
localization:
  auto: true
  default: "zh-CN"
